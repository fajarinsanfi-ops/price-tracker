name: Supabase Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-integration
  cancel-in-progress: true

jobs:
  verify-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Supabase secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL:-}" ]]; then
            echo "::error::Missing repository secret SUPABASE_URL"
            exit 1
          fi

          if [[ -z "${SUPABASE_SECRET_KEY:-}" && -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "::error::Missing SUPABASE_SECRET_KEY (recommended) or SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

          if [[ "$SUPABASE_URL" != https://* ]]; then
            echo "::error::SUPABASE_URL must use HTTPS"
            exit 1
          fi

      - name: Verify required Supabase REST resources
        shell: bash
        run: |
          set -euo pipefail

          key="${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          base="${SUPABASE_URL%/}/rest/v1"

          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          key = os.environ.get("SUPABASE_SECRET_KEY") or os.environ.get("SUPABASE_SERVICE_ROLE_KEY")
          base = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1"
          tables = [
              "products",
              "price_history",
              "notification_logs",
              "notification_settings",
              "price_check_runs",
          ]

          for table in tables:
              url = f"{base}/{table}?select=*&limit=1"
              request = urllib.request.Request(
                  url,
                  headers={
                      "apikey": key,
                      "Authorization": f"Bearer {key}",
                      "Accept": "application/json",
                  },
              )

              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status = response.status
                      body = response.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  body = exc.read(500).decode("utf-8", errors="replace")
                  print(f"::error::{table}: HTTP {exc.code}: {body}")
                  sys.exit(1)
              except Exception as exc:
                  print(f"::error::{table}: connection failed: {exc}")
                  sys.exit(1)

              if status != 200:
                  print(f"::error::{table}: unexpected HTTP {status}")
                  sys.exit(1)

              try:
                  payload = json.loads(body)
              except json.JSONDecodeError:
                  print(f"::error::{table}: response was not valid JSON")
                  sys.exit(1)

              if not isinstance(payload, list):
                  print(f"::error::{table}: expected a JSON array")
                  sys.exit(1)

              print(f"PASS: {table} ({len(payload)} row(s) returned by limit=1)")

          print("All required Supabase REST resources passed.")
          PY

      - name: Run Python unit tests
        working-directory: worker
        run: |
          python -m pip install -r requirements.txt
          pytest -q
